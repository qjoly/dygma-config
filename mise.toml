[tools]
python = "3"

[tasks.sync]
description = "Import the latest Bazecor backup into JSON + YAML + SVG (no commit)"
run = "python3 sync.py"

[tasks.restore]
description = "Rebuild a flashable JSON from layers.yaml (patched onto defy.json)"
run = "python3 restore.py"

[tasks.preview]
description = "Render every layer SVG to PNG under preview/ (needs rsvg-convert)"
run = """
mkdir -p preview
for f in layouts/*.svg; do
  rsvg-convert -w 1300 "$f" -o "preview/$(basename "${f%.svg}").png"
done
echo "PNGs written to preview/"
"""

[tasks.diff]
description = "Regenerate from the latest backup and show what differs from the repo"
run = """
python3 sync.py
echo "---"
git --no-pager diff --stat
git --no-pager diff
"""
